<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="google-site-verification" content="zLXkD3HCnlS_8Brjc4aApYmXSFZ2Ik1J6k2dO6zax_c" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Snap Studio - Aplikasi Photobooth Online Gratis</title>

    <meta name="description" content="Gunakan Snap Studio untuk pengalaman photobooth digital yang seru, otomatis, dan gratis langsung dari browser kamu. Abadikan momen terbaikmu sekarang!">

    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://ahmadrosyidbaru-sys.github.io/photoboth/" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800&family=Playfair+Display:ital,wght@1,900&family=JetBrains+Mono:wght@800&family=Bebas+Neue&family=Pacifico&family=Space+Grotesk:wght@700&family=Syne:wght@800&family=Abril+Fatface&family=Outfit:wght@900&family=Unbounded:wght@900&family=Righteous&family=Bungee&family=Fraunces:ital,opsz,wght@1,9..144,900&family=Monoton&family=Modak&family=Press+Start+2P&family=Permanent+Marker&family=Alumni+Sans+Inline+One&family=Kablammo&family=Honk&display=swap" rel="stylesheet">
    
    <style>
        body { background: #ffffff; color: #000; font-family: 'Plus Jakarta Sans', sans-serif; height: 100vh; overflow: hidden; scroll-behavior: smooth; }
        .mirror { transform: scaleX(-1); }

        .glass { background: rgba(0,0,0,0.05); backdrop-filter: blur(25px); border: 1px solid rgba(0,0,0,0.1); }

        /* Count down */
        #countdown-box { opacity: 0.8; font-weight: 800; pointer-events: none; text-shadow: 0 0 50px rgba(59, 130, 246, 0.5); z-index: 50; color: #3b82f6; }

        /* Flash animation */
        .flash-active { animation: flash 0.4s ease-out; }
        @keyframes flash { 0% { background: #fff; opacity: 1; } 100% { background: transparent; opacity: 0; } }

        /* Canvas */
        canvas { max-height: 70vh; width: auto; max-width: 100%; border-radius: 14px; box-shadow: 0 30px 60px -12px rgba(0,0,0,0.2); background: #eee; }

        /* Consistent button system */
        .btn {
            border-radius: 16px;
            font-weight: 900;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            transition: transform 120ms ease, background-color 160ms ease, border-color 160ms ease, box-shadow 160ms ease, color 160ms ease, opacity 160ms ease;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active { transform: scale(0.98); }
        .btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            transform: none;
        }
        .btn:focus-visible {
            outline: none;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.25);
        }

        .btn-primary {
            background: #2563eb;
            color: #fff;
            box-shadow: 0 18px 40px -18px rgba(37, 99, 235, 0.6);
        }
        .btn-primary:hover:not(:disabled) { background: #1d4ed8; }

        .btn-secondary {
            background: #0b0b0f;
            color: #fff;
        }
        .btn-secondary:hover:not(:disabled) { background: #111827; }

        .btn-ghost {
            background: rgba(255,255,255,0.18);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.55);
            backdrop-filter: blur(10px);
        }
        .btn-ghost:hover:not(:disabled) { background: rgba(255,255,255,0.28); }

        .btn-choice {
            background: rgba(255,255,255,0.65);
            color: #0b0b0f;
            border: 1px solid rgba(0,0,0,0.10);
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        .btn-choice:hover:not(:disabled) { background: rgba(59, 130, 246, 0.07); border-color: rgba(37, 99, 235, 0.25); }
        .btn-choice.is-active {
            background: #2563eb;
            color: #fff;
            border-color: #2563eb;
            box-shadow: 0 12px 30px -20px rgba(37, 99, 235, 0.7);
        }

        /* Backward compat: old active class name */
        .btn-active { border-color: #3b82f6 !important; background: #3b82f6 !important; color: #fff !important; }
        /* New active class name used by JS */
        .is-active {
            border-color: #2563eb !important;
            background: #2563eb !important;
            color: #ffffff !important;
            box-shadow: 0 12px 30px -20px rgba(37, 99, 235, 0.7) !important;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .editor-container { animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* Color picker */
        #bg-picker { -webkit-appearance: none; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; padding: 0; overflow: hidden; }
        #bg-picker::-webkit-color-swatch-wrapper { padding: 0; }
        #bg-picker::-webkit-color-swatch { border: none; border-radius: 50%; }

        /* Font grid */
        .font-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }

        /* Faster, clearer disabled look for snap ring */
        #snap-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    </style>
</head>
<body class="flex items-center justify-center">

    <div id="flash" class="fixed inset-0 z-[200] pointer-events-none"></div>

    <section id="welcome-screen" class="fixed inset-0 z-[150] bg-white flex items-center justify-center p-6">
        <div class="w-full max-w-md space-y-8 text-center">
            <div class="space-y-2">
                <h1 class="text-7xl font-black italic tracking-tighter text-blue-600 uppercase">Snap Studio</h1>
                <p class="text-black/30 text-[10px] font-bold uppercase tracking-[0.5em]">Creative Studio by Ocit</p>
            </div>
            
            <div id="step-name" class="space-y-4">
                <input type="text" id="user-name" placeholder="MASUKKAN NAMA..." class="w-full bg-white border border-black/10 p-6 rounded-2xl text-center font-bold outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100 uppercase transition-all">
                <button onclick="goToLayoutStep()" class="btn btn-primary w-full py-5 rounded-2xl">Mulai Sesi</button>
            </div>

            <div id="step-layout" class="space-y-6 hidden animate-[slideUp_0.4s_ease]">
                <p class="text-blue-600 font-black uppercase tracking-widest text-xs">Pilih Layout Studio</p>
                <div class="grid grid-cols-2 gap-4">
                    <button onclick="selectLayoutAndStart('strip')" class="btn btn-choice p-6 rounded-2xl flex flex-col items-center justify-center gap-4 border border-black/10 hover:border-blue-500 h-44 transition-all">
                        <div class="w-12 h-20 bg-black/5 rounded border border-black/10 flex flex-col gap-1 p-1">
                            <div class="bg-black/20 flex-1 rounded-sm"></div>
                            <div class="bg-black/20 flex-1 rounded-sm"></div>
                            <div class="bg-black/20 flex-1 rounded-sm"></div>
                        </div>
                        <span class="text-xs font-black tracking-wide">Strip (3)</span>
                    </button>
                    
                    <button onclick="selectLayoutAndStart('grid')" class="btn btn-choice p-6 rounded-2xl flex flex-col items-center justify-center gap-4 border border-black/10 hover:border-blue-500 h-44 transition-all">
                        <div class="w-16 h-16 bg-black/5 rounded border border-black/10 grid grid-cols-2 gap-1 p-1">
                            <div class="bg-black/20 rounded-sm"></div>
                            <div class="bg-black/20 rounded-sm"></div>
                            <div class="bg-black/20 rounded-sm"></div>
                            <div class="bg-black/20 rounded-sm"></div>
                        </div>
                        <span class="text-xs font-black tracking-wide">Grid (4)</span>
                    </button>
                </div>
                <button onclick="backToNameStep()" class="text-[10px] font-black text-black/30 uppercase tracking-widest hover:text-black transition-colors block mx-auto">← Kembali ganti nama</button>
            </div>
        </div>
    </section>

    <main id="main-app" class="hidden w-full h-full flex flex-col lg:flex-row overflow-hidden">
        
        <div id="camera-section" class="lg:w-1/2 w-full h-full bg-slate-50 flex flex-col items-center justify-center p-4 relative shrink-0">
            <div class="relative w-full max-w-md aspect-square rounded-[2rem] overflow-hidden border border-black/5 bg-black shadow-2xl">
                <video id="video" autoplay playsinline class="mirror w-full h-full object-cover"></video>
                <div id="countdown-box" class="absolute inset-0 flex items-center justify-center text-[150px]"></div>
                
                <div id="snap-container" class="absolute bottom-6 left-0 right-0 flex flex-col justify-center items-center gap-4">
                    <button onclick="switchCamera()" class="btn btn-ghost w-14 h-14 rounded-full flex items-center justify-center">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>
                    </button>
                    <button id="snap-btn" onclick="takeIndividualSnap()" class="btn w-18 h-18 bg-white/20 backdrop-blur-md border-4 border-white rounded-full flex items-center justify-center hover:scale-110 active:scale(0.9) group px-0">
                        <div class="w-12 h-12 bg-white rounded-full group-hover:bg-blue-500 transition-colors"></div>
                    </button>
                </div>
            </div>

            <div id="capture-controls" class="mt-6 w-full max-w-md flex flex-col items-center gap-4 opacity-0 pointer-events-none transition-all duration-300">
                <p class="text-blue-600 font-black uppercase tracking-widest text-[10px]">Hasil Jepretan</p>
                <div class="flex gap-4 w-full">
                    <button onclick="retakePhoto()" class="btn btn-secondary flex-1 px-6 py-4 rounded-xl text-xs">Ulangi</button>
                    <button onclick="keepPhoto()" class="btn btn-primary flex-1 px-6 py-4 rounded-xl text-xs">Keep It</button>
                </div>
            </div>

            <div id="layout-tools" class="mt-6 w-full max-w-md">
                <div class="glass p-2 rounded-2xl flex gap-2">
                    <button onclick="setLayout('strip')" id="btn-strip" class="btn btn-choice flex-1 py-3 rounded-xl text-[10px]">Strip (3)</button>
                    <button onclick="setLayout('grid')" id="btn-grid" class="btn btn-choice flex-1 py-3 rounded-xl text-[10px]">Grid (4)</button>
                </div>
            </div>
        </div>

        <div id="editing-section" class="lg:w-1/2 w-full h-full bg-white border-l border-black/5 flex flex-col items-center p-6 lg:p-12 overflow-y-auto no-scrollbar shrink-0">
            <div class="w-full max-w-md space-y-10">
                <div class="flex flex-col items-center">
                    <canvas id="main-canvas"></canvas>
                </div>

                <div id="editor-tools" class="hidden editor-container space-y-10 pb-12">
                    <div class="space-y-4">
                        <label class="text-[10px] font-black text-black/30 uppercase tracking-[0.2em]">Pilih Mood Filter</label>
                        <div class="grid grid-cols-5 gap-2">
                            <button onclick="setFilter('none')" data-filter="none" class="btn btn-choice p-2 rounded-lg text-[8px]">Nrm</button>
                            <button onclick="setFilter('grayscale(100%)')" data-filter="grayscale(100%)" class="btn btn-choice p-2 rounded-lg text-[8px]">B&W</button>
                            <button onclick="setFilter('sepia(80%)')" data-filter="sepia(80%)" class="btn btn-choice p-2 rounded-lg text-[8px]">Sep</button>
                            <button onclick="setFilter('contrast(1.4) brightness(0.9)')" data-filter="contrast(1.4) brightness(0.9)" class="btn btn-choice p-2 rounded-lg text-[8px]">Vnt</button>
                            <button onclick="setFilter('hue-rotate(180deg)')" data-filter="hue-rotate(180deg)" class="btn btn-choice p-2 rounded-lg text-[8px]">Cld</button>
                        </div>
                    </div>

                    <div class="space-y-4">
                        <label class="text-[10px] font-black text-black/30 uppercase tracking-[0.2em]">Pilih Gaya Huruf</label>
                        <div class="font-grid">
                            <button onclick="setFont('Plus Jakarta Sans')" data-font="Plus Jakarta Sans" class="btn btn-choice p-2 rounded-lg text-[9px]">Jakarta</button>
                            <button onclick="setFont('Playfair Display')" data-font="Playfair Display" class="btn btn-choice p-2 rounded-lg text-[9px] italic">Playfair</button>
                            <button onclick="setFont('JetBrains Mono')" data-font="JetBrains Mono" class="btn btn-choice p-2 rounded-lg text-[9px]">Mono</button>
                            <button onclick="setFont('Bebas Neue')" data-font="Bebas Neue" class="btn btn-choice p-2 rounded-lg text-[9px]">Bebas</button>
                            <button onclick="setFont('Pacifico')" data-font="Pacifico" class="btn btn-choice p-2 rounded-lg text-[9px]">Script</button>
                            <button onclick="setFont('Space Grotesk')" data-font="Space Grotesk" class="btn btn-choice p-2 rounded-lg text-[9px]">Space</button>
                            <button onclick="setFont('Syne')" data-font="Syne" class="btn btn-choice p-2 rounded-lg text-[9px]">Syne</button>
                            <button onclick="setFont('Abril Fatface')" data-font="Abril Fatface" class="btn btn-choice p-2 rounded-lg text-[9px]">Abril</button>
                            <button onclick="setFont('Outfit')" data-font="Outfit" class="btn btn-choice p-2 rounded-lg text-[9px]">Outfit</button>
                            <button onclick="setFont('Unbounded')" data-font="Unbounded" class="btn btn-choice p-2 rounded-lg text-[9px]">Bound</button>
                            <button onclick="setFont('Righteous')" data-font="Righteous" class="btn btn-choice p-2 rounded-lg text-[9px]">Right</button>
                            <button onclick="setFont('Bungee')" data-font="Bungee" class="btn btn-choice p-2 rounded-lg text-[9px]">Bungee</button>
                            <button onclick="setFont('Fraunces')" data-font="Fraunces" class="btn btn-choice p-2 rounded-lg text-[9px]">Fraun</button>
                            <button onclick="setFont('Monoton')" data-font="Monoton" class="btn btn-choice p-2 rounded-lg text-[9px]">MonoT</button>
                            <button onclick="setFont('Modak')" data-font="Modak" class="btn btn-choice p-2 rounded-lg text-[9px]">Modak</button>
                            <button onclick="setFont('Press Start 2P')" data-font="Press Start 2P" class="btn btn-choice p-2 rounded-lg text-[7px]">Retro</button>
                            <button onclick="setFont('Permanent Marker')" data-font="Permanent Marker" class="btn btn-choice p-2 rounded-lg text-[8px]">Marker</button>
                            <button onclick="setFont('Alumni Sans Inline One')" data-font="Alumni Sans Inline One" class="btn btn-choice p-2 rounded-lg text-[9px]">Inline</button>
                            <button onclick="setFont('Kablammo')" data-font="Kablammo" class="btn btn-choice p-2 rounded-lg text-[9px]">Kablam</button>
                            <button onclick="setFont('Honk')" data-font="Honk" class="btn btn-choice p-2 rounded-lg text-[9px]">Honk</button>
                        </div>
                    </div>

                    <div class="space-y-4">
                        <label class="text-[10px] font-black text-black/30 uppercase tracking-[0.2em]">Caption & Warna Background</label>
                        <div class="flex gap-2">
                            <input type="text" id="custom-text" placeholder="TULIS CAPTION..." maxlength="20" oninput="drawFinal()" class="flex-1 bg-black/5 border border-black/10 p-4 rounded-xl text-xs font-bold outline-none focus:border-blue-500 uppercase">
                            <input type="color" id="bg-picker" value="#ffffff" oninput="changeBg(this.value)">
                        </div>
                    </div>

                    <div id="upload-box" class="glass p-8 rounded-[2.5rem] flex flex-col items-center gap-6 hidden">
                         <div id="qr-container" class="bg-white p-4 rounded-3xl border border-black/5">
                             <img id="qr-code" class="w-32 h-32">
                         </div>
                         <p id="upload-status" class="text-[10px] font-black text-blue-600 uppercase tracking-widest text-center">Menyimpan Sesi...</p>
                    </div>

                    <div class="space-y-3">
                        <button id="sync-btn" onclick="processAndUpload()" class="btn btn-primary w-full py-6 rounded-2xl text-xs">Simpan & Dapatkan QR</button>
                        <button onclick="window.location.reload()" class="btn btn-secondary w-full py-4 rounded-2xl text-[10px]">Reset Sesi</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx-3Cg40eElzmYghvBv__8S3xc1GVXrUCGH6CimfKZm0Vmil_Y0CWMKth9W_ka0lZUhzQ/exec"; 
        const DRIVE_URL = "https://drive.google.com/drive/folders/1wfP3gvg2WOY_mgiBqmuGjuw5Mz-KXxFF";

        const video = document.getElementById('video');
        const canvas = document.getElementById('main-canvas');
        const flash = document.getElementById('flash');
        
        let userName = "";
        let sessionPhotos = [];
        let rawPhotos = [];
        let currentLayout = 'strip';
        let bgColor = '#ffffff';
        let currentFont = 'Plus Jakarta Sans';
        let currentFilter = 'none';
        let lastTempSnap = null;
        let currentFacingMode = 'user';

        async function initCamera(facingMode = 'user') {
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
            }
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: facingMode, aspectRatio: 1/1, width: 1080, height: 1080 }, 
                    audio: false 
                });
                video.srcObject = stream;
                if(facingMode === 'user') video.classList.add('mirror');
                else video.classList.remove('mirror');
            } catch (e) { alert("Kamera tidak ditemukan."); }
        }

        function switchCamera() {
            currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
            initCamera(currentFacingMode);
        }

        function goToLayoutStep() {
            userName = document.getElementById('user-name').value.trim().toUpperCase() || "GUEST";
            document.getElementById('step-name').classList.add('hidden');
            document.getElementById('step-layout').classList.remove('hidden');
        }

        function backToNameStep() {
            document.getElementById('step-layout').classList.add('hidden');
            document.getElementById('step-name').classList.remove('hidden');
        }

        function selectLayoutAndStart(layout) {
            document.getElementById('welcome-screen').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
            setLayout(layout);
            initCamera(currentFacingMode);
            syncActiveChoiceUI();
        }

        function setLayout(l) {
            currentLayout = l;
            document.querySelectorAll('#btn-strip, #btn-grid').forEach(b => b.classList.remove('is-active'));
            const btn = document.getElementById(`btn-${l}`);
            if (btn) btn.classList.add('is-active');
            drawFinal();
        }

        function setFont(f) {
            currentFont = f;
            document.querySelectorAll('[data-font]').forEach(b => b.classList.remove('is-active'));
            const active = document.querySelector(`[data-font="${CSS.escape(f)}"]`);
            if (active) active.classList.add('is-active');
            drawFinal();
        }

        function setFilter(f) {
            currentFilter = f;
            document.querySelectorAll('[data-filter]').forEach(b => b.classList.remove('is-active'));
            const active = document.querySelector(`[data-filter="${CSS.escape(f)}"]`);
            if (active) active.classList.add('is-active');
            drawFinal();
        }

        function changeBg(c) { bgColor = c; drawFinal(); }

        async function takeIndividualSnap() {
            const max = currentLayout === 'strip' ? 3 : 4;
            if(sessionPhotos.length >= max) return;
            
            document.getElementById('snap-btn').disabled = true;
            await countdown(3);
            triggerFlash();

            const temp = document.createElement('canvas');
            temp.width = 800; temp.height = 800;
            const ctx = temp.getContext('2d');
            
            if(currentFacingMode === 'user') {
                ctx.translate(800, 0); ctx.scale(-1, 1);
            }
            
            const size = Math.min(video.videoWidth, video.videoHeight);
            const startX = (video.videoWidth - size) / 2;
            const startY = (video.videoHeight - size) / 2;
            ctx.drawImage(video, startX, startY, size, size, 0, 0, 800, 800);
            
            lastTempSnap = temp;
            drawFinal(true);
            toggleOverlay(true);
        }

        function toggleOverlay(show) {
            const c = document.getElementById('capture-controls');
            const s = document.getElementById('snap-container');
            const lt = document.getElementById('layout-tools');
            if(show) { 
                c.classList.remove('pointer-events-none'); 
                c.classList.add('opacity-100'); 
                s.classList.add('hidden');
                lt.classList.add('hidden');
                video.pause(); 
            }
            else { 
                c.classList.add('pointer-events-none'); 
                c.classList.remove('opacity-100'); 
                s.classList.remove('hidden');
                lt.classList.remove('hidden');
                video.play(); 
                document.getElementById('snap-btn').disabled = false; 
            }
        }

        function keepPhoto() {
            sessionPhotos.push(lastTempSnap);
            rawPhotos.push(lastTempSnap.toDataURL('image/png').split(',')[1]);
            toggleOverlay(false);
            drawFinal();
            
            const max = currentLayout === 'strip' ? 3 : 4;
            if(sessionPhotos.length >= max) {
                document.getElementById('camera-section').classList.add('hidden');
                document.getElementById('editor-tools').classList.remove('hidden');
                document.getElementById('editing-section').scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function retakePhoto() {
            lastTempSnap = null;
            toggleOverlay(false);
            drawFinal();
        }

        function syncActiveChoiceUI() {
            document.querySelectorAll('#btn-strip, #btn-grid').forEach(b => b.classList.remove('is-active'));
            const layoutBtn = document.getElementById(`btn-${currentLayout}`);
            if (layoutBtn) layoutBtn.classList.add('is-active');

            document.querySelectorAll('[data-filter]').forEach(b => b.classList.remove('is-active'));
            const filterBtn = document.querySelector(`[data-filter="${CSS.escape(currentFilter)}"]`);
            if (filterBtn) filterBtn.classList.add('is-active');

            document.querySelectorAll('[data-font]').forEach(b => b.classList.remove('is-active'));
            const fontBtn = document.querySelector(`[data-font="${CSS.escape(currentFont)}"]`);
            if (fontBtn) fontBtn.classList.add('is-active');
        }

        function countdown(sec) {
            const box = document.getElementById('countdown-box');
            return new Promise(resolve => {
                let t = sec;
                let timer = setInterval(() => {
                    box.innerText = t;
                    if (t <= 0) { clearInterval(timer); box.innerText = ''; resolve(); }
                    t--;
                }, 1000);
            });
        }

        function triggerFlash() {
            flash.classList.add('flash-active');
            setTimeout(() => flash.classList.remove('flash-active'), 400);
        }

        function drawFinal(isPreview = false) {
            const ctx = canvas.getContext('2d');
            const isStrip = currentLayout === 'strip';
            
            // PERBAIKAN: Tinggi canvas untuk Grid ditambah agar teks tidak menimpa foto
            canvas.width = isStrip ? 400 : 800;
            canvas.height = isStrip ? 1200 : 860; 
            
            ctx.fillStyle = bgColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const maxSlots = isStrip ? 3 : 4;
            for(let i=0; i < maxSlots; i++) {
                const x = isStrip ? 20 : (i % 2 === 0 ? 20 : 410);
                const y = isStrip ? (20 + (i * 380)) : (i < 2 ? 20 : 410);
                
                let imgToDraw = sessionPhotos[i];
                let isTemp = false;

                if(!imgToDraw && isPreview && i === sessionPhotos.length) {
                    imgToDraw = lastTempSnap;
                    isTemp = true;
                }

                if(!imgToDraw) {
                    ctx.fillStyle = 'rgba(0,0,0,0.05)';
                    ctx.fillRect(x, y, 360, 360);
                } else {
                    ctx.save();
                    if(!isTemp) ctx.filter = currentFilter;
                    ctx.drawImage(imgToDraw, 0, 0, 800, 800, x, y, 360, 360);
                    if(isTemp) {
                        ctx.strokeStyle = '#3b82f6';
                        ctx.lineWidth = 8;
                        ctx.strokeRect(x+4, y+4, 352, 352);
                    }
                    ctx.restore();
                }
            }

            const r = parseInt(bgColor.slice(1,3), 16);
            const g = parseInt(bgColor.slice(3,5), 16);
            const b = parseInt(bgColor.slice(5,7), 16);
            const brightness = (r * 299 + g * 587 + b * 114) / 1000;
            const textColor = brightness > 128 ? '#000000' : '#ffffff';

            ctx.font = `bold 28px "${currentFont}"`;
            ctx.textAlign = 'center';
            const txt = document.getElementById('custom-text').value.toUpperCase() || `SNAP STUDIO x ${userName}`;

            ctx.fillStyle = textColor;
            // PERBAIKAN: Posisi teks selalu di bawah area canvas (canvas.height - 35)
            ctx.fillText(txt, canvas.width / 2, canvas.height - 35);
        }

        async function processAndUpload() {
            const btn = document.getElementById('sync-btn');
            const status = document.getElementById('upload-status');
            const box = document.getElementById('upload-box');
            btn.disabled = true; btn.innerText = "SEDANG MENGIRIM...";
            box.classList.remove('hidden');
            const sessionID = `${userName}-${Date.now()}`;

            for(let i=0; i<rawPhotos.length; i++) {
                status.innerText = `SYNC PHOTO ${i+1}/${rawPhotos.length}...`;
                await fetch(SCRIPT_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ sessionID, base64: rawPhotos[i], fileName: `RAW-${i+1}.png` })});
            }
            status.innerText = "GENERATING FINAL RESULT...";
            const final = canvas.toDataURL('image/png').split(',')[1];
            await fetch(SCRIPT_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ sessionID, base64: final, fileName: `RESULT-${userName}.png` })});
            
            status.innerText = "SESI BERHASIL DISIMPAN!";
            document.getElementById('qr-code').src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(DRIVE_URL)}`;
            btn.innerText = "SELESAI";
        }
    </script>
</body>
